<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Campfire Pomodoro</title>
    <!-- Chart.js for Daily Analytics bar chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Campfire GIF as background -->
    <div class="campfire-background">
        <img id="backgroundGif" src="high_fire.gif" alt="Campfire Background">
    </div>

    <!-- Dark overlay for readability -->
    <div class="overlay"></div>

    <!-- Starry background -->
    <div class="stars" id="stars"></div>

    <!-- LEFT PANEL - Stats and Sessions -->
    <div class="left-panel" id="leftPanel">
        <div class="panel-header" onclick="toggleLeftPanel()">
            <h2>📊 Dashboard</h2>
            <button class="minimize-btn" id="leftMinimizeBtn">▼</button>
        </div>
        <div class="panel-content">
            <!-- Stats -->
            <div class="stats-box">
                <h3>Today's Stats</h3>
                <div class="stat-item">
                    <span class="stat-label">Work Sessions:</span>
                    <span class="stat-value" id="workSessionsCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Break Sessions:</span>
                    <span class="stat-value" id="breakSessionsCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Work Time:</span>
                    <span class="stat-value" id="totalWorkTime">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Break Time:</span>
                    <span class="stat-value" id="totalBreakTime">0m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pomodoros Completed:</span>
                    <span class="stat-value" id="pomodorosCompleted">0</span>
                </div>
            </div>

            <!-- Analytics Button -->
            <button class="settings-toggle" onclick="openDailyAnalytics()">📈 Daily Analytics</button>

            <!-- Session History -->
            <button class="history-toggle" onclick="toggleSessionHistory()">📜 Session History</button>
            <div class="session-history-content" id="sessionHistoryContent">
                <div class="session-history-compact" id="sessionHistoryCompact">
                    <h3>Recent Sessions</h3>
                    <div id="recentSessionsList"></div>
                </div>
                <button class="clear-history-btn" onclick="clearAllSessions()">Clear History</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL - Timer and Controls -->
    <div class="right-panel" id="rightPanel">
        <div class="panel-header">
            <h1>🍅 Pomodoro</h1>
            <div class="panel-header-controls">
                <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
                <button class="minimize-btn" id="rightMinimizeBtn">▼</button>
            </div>
        </div>
        <div class="panel-content">
            <!-- Floating timer (visible when minimized) -->
            <div class="floating-timer" id="floatingTimer">25:00</div>
            <div class="floating-session-type" id="floatingSessionType">Work Session</div>

            <!-- Main timer display -->
            <div class="session-type" id="sessionType">Work Session</div>
            <div class="timer-display" id="timer">25:00</div>
            
            <!-- Fire stage indicator -->
            <div class="fire-stage-indicator" id="fireStage">🔥 Fire: High</div>
            
            <!-- Current session info -->
            <div class="current-session-info" id="currentSessionInfo"></div>

            <!-- Progress bar -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="startBtn" onclick="startTimer()">Start</button>
                <button id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
                <button onclick="resetTimer()">Reset</button>
                <button onclick="skipSession()">Skip</button>
            </div>

            <!-- Settings -->
            <button class="settings-toggle" onclick="toggleSettings()">⚙️ Settings</button>
            <div class="settings-content" id="settingsContent">
                <div class="settings-panel">
                    <div class="settings-grid">
                        <!-- Duration Settings -->
                        <div class="setting-item">
                            <label for="workDurationInput">Work Duration (min)</label>
                            <input type="number" id="workDurationInput" min="1" max="60" value="25" onchange="updateWorkDuration()">
                        </div>

                        <div class="setting-item">
                            <label for="shortBreakInput">Short Break (min)</label>
                            <input type="number" id="shortBreakInput" min="1" max="30" value="5" onchange="updateShortBreak()">
                        </div>

                        <div class="setting-item">
                            <label for="longBreakInput">Long Break (min)</label>
                            <input type="number" id="longBreakInput" min="1" max="60" value="15" onchange="updateLongBreak()">
                        </div>

                        <!-- Audio settings -->
                        <div class="setting-item">
                            <label>
                                <input type="checkbox" id="tickingSoundCheckbox" onchange="toggleTickingSound()">
                                🔊 Ticking Sound
                            </label>
                        </div>

                        <!-- Background settings -->
                        <div class="background-section">
                            <h4>Background</h4>
                            <div class="setting-item">
                                <label for="wallpaperSelect">Wallpaper</label>
                                <select id="wallpaperSelect" onchange="changeWallpaper()">
                                    <option value="campfire">Campfire (Default)</option>
                                    <option value="forest">Forest</option>
                                    <option value="mountain">Mountain</option>
                                    <option value="ocean">Ocean</option>
                                </select>
                            </div>

                            <div class="setting-item">
                                <label for="opacitySlider">Opacity: <span id="opacityValue">40%</span></label>
                                <input type="range" id="opacitySlider" min="0" max="100" value="40" onchange="changeBackgroundOpacity(this.value)">
                                <div class="opacity-display">Adjust background visibility</div>
                            </div>

                            <div class="setting-item">
                                <label for="bgFileUpload">Upload Custom Background</label>
                                <input type="file" id="bgFileUpload" accept="image/*" onchange="handleBackgroundUpload()">
                            </div>

                            <button class="reset-background-btn" onclick="resetBackground()">Reset to Default</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Analytics Modal -->
    <div id="analyticsModal" class="analytics-modal">
        <div class="analytics-content">
            <button class="analytics-close" onclick="closeAnalytics()">✕</button>
            <h2 class="analytics-header">📈 Daily Analytics</h2>
            <div class="day-selector" id="daySelector"></div>
            <canvas id="hourlyChart"></canvas>
            <div class="analytics-summary" id="analyticsSummary"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
